<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2d5a3d">
  <title>Conroy's Flowers Training</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary: #2d5a3d;
      --accent: #e8a0bf;
      --bg: #f7f9f7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 80px;
    }
    .hidden { display: none !important; }
    #login-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #f0f7f2 0%, #fff 100%);
    }
    #login-screen img.header-img {
      width: 100%;
      max-width: 280px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    #login-screen h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
      text-align: center;
    }
    #login-screen p { color: var(--muted); margin-bottom: 24px; text-align: center; font-size: 0.95rem; }
    .login-form { width: 100%; max-width: 320px; }
    .login-form input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
    }
    .login-form input:focus { outline: none; border-color: var(--primary); }
    #login-error {
      color: var(--danger);
      font-size: 0.9rem;
      margin-bottom: 12px;
      text-align: center;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-sm { padding: 8px 14px; font-size: 0.9rem; }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); color: #111; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--primary);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .app-header .user-info { font-size: 0.9rem; opacity: 0.95; }
    .app-header .lang-select {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    .main { padding: 16px; max-width: 640px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: 999px;
      transition: width 0.3s;
    }
    .stamp-list { display: flex; flex-direction: column; gap: 10px; }
    .stamp-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }
    .stamp-item.done {
      border-color: var(--success);
      background: #f0fdf4;
    }
    .stamp-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .stamp-item.done .stamp-check {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .stamp-content { flex: 1; }
    .stamp-title { font-weight: 600; font-size: 0.98rem; }
    .stamp-desc { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .stamp-time { font-size: 0.75rem; color: var(--success); margin-top: 4px; }
    .next-banner {
      background: linear-gradient(135deg, #2d5a3d, #3d7a52);
      color: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .next-label {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .eod-banner {
      background: #fff7ed;
      border: 2px solid #fdba74;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .quick-btn {
      padding: 16px 12px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .quick-btn.customer { border-color: #93c5fd; background: #eff6ff; color: #1e40af; }
    .quick-btn.phone { border-color: #c4b5fd; background: #f5f3ff; color: #5b21b6; }
    .quick-btn.messages { border-color: #fcd34d; background: #fffbeb; color: #92400e; }
    .quick-btn.back { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      font-size: 0.7rem;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 10px;
      min-width: 56px;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-item .icon { font-size: 1.35rem; }
    .page { display: none; }
    .page.active { display: block; }
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .alert-warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-row input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
    }
    .voice-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .voice-btn.listening { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-content {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
    }
    .close-modal {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
    }
    .float-mic {
      position: fixed;
      right: 16px;
      bottom: 90px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.5rem;
      box-shadow: 0 4px 16px rgba(45,90,61,0.4);
      z-index: 90;
      cursor: pointer;
    }
    .float-mic-panel {
      position: fixed;
      right: 16px;
      bottom: 160px;
      width: min(340px, calc(100vw - 32px));
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      z-index: 95;
      display: none;
      border: 1px solid var(--border);
    }
    .float-mic-panel.open { display: block; }
    .speak-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    img.content-img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <!-- This is a temporary minimal shell. The complete v1.14.0 index.html is in the release zip. -->
  <div id="login-screen">
    <img src="header.jpg" alt="Conroy's Flowers Training" class="header-img">
    <h1>Employee Login</h1>
    <p style="font-size:0.8rem;color:var(--muted);margin-bottom:4px">v1.14.0</p>
    <p>Enter your ID and password</p>
    <div class="login-form">
      <input type="text" id="login-username" placeholder="Username" autocomplete="username" autocapitalize="none">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <div id="login-error" class="hidden"></div>
      <button class="btn" style="width:100%;margin-top:4px" onclick="alert('Full app is being restored. Please wait for the next deploy or use the v1.14.0 zip.')">Log in</button>
    </div>
  </div>
  <script>
    console.log('Temporary index - full version coming');
  </script>
</body>
</html>
