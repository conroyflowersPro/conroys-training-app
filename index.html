<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a3c34">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Conroy's Training</title>
  <link rel="manifest" href="manifest.json?v=5.0.4">
  <link rel="apple-touch-icon" href="images/ui/header.webp">
  <style>
    :root {
      --primary: #1a3c34; --accent: #c4a35a; --bg: #f7f5f0; --card: #ffffff;
      --text: #1a1a1a; --muted: #6b7280; --success: #16a34a; --warn: #d97706;
      --danger: #dc2626; --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    #login-screen {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 20px; text-align: center;
    }
    .header-img { width: 100%; max-width: 320px; height: auto; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
    #login-screen h1 { font-size: 1.5rem; margin-bottom: 4px; color: var(--primary); }
    .login-form { width: 100%; max-width: 320px; margin-top: 12px; }
    .login-form input {
      width: 100%; padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid #e5e7eb;
      border-radius: 12px; font-size: 1rem; background: #fff;
    }
    .login-form input:focus { outline: none; border-color: var(--primary); }
    #login-error { color: var(--danger); font-size: 0.9rem; margin-bottom: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; padding: 13px 20px;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
      background: var(--primary); color: #fff; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-sm { padding: 8px 14px; font-size: 0.9rem; }
    .hidden { display: none !important; }
    #app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    .app-header {
      position: sticky; top: 0; z-index: 50; background: var(--primary); color: #fff;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .user-info { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
    .lang-select {
      background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; padding: 6px 8px; font-size: 0.85rem;
    }
    .lang-select option { color: #111; }
    .main { flex: 1; padding: 16px; padding-bottom: calc(90px + 120px); overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }
    h2 { font-size: 1.15rem; margin-bottom: 12px; color: var(--primary); }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 4px; transition: width 0.3s; }
    .stamp-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
    .stamp-item:last-child { border-bottom: none; }
    .stamp-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 0.85rem; cursor: pointer; background: #fff;
    }
    .stamp-btn.done { background: var(--success); border-color: var(--success); color: #fff; }
    .stamp-content { flex: 1; min-width: 0; }
    .stamp-title { font-weight: 600; font-size: 0.98rem; }
    .stamp-desc { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .stamp-time { font-size: 0.8rem; color: var(--success); margin-top: 4px; }
    .stamp-item.next-task { background: #f0fdf4; margin: 0 -16px; padding: 14px 16px; border-radius: 12px; }
    .stamp-item.next-task .stamp-title::before { content: "👉 "; }
    .next-banner {
      background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .next-banner.hidden { display: none; }
    .next-banner .next-label { font-weight: 700; color: #065f46; font-size: 0.85rem; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .quick-btn {
      padding: 14px 10px; border-radius: 12px; border: none; font-weight: 600;
      font-size: 0.92rem; cursor: pointer; text-align: center;
    }
    .quick-btn.customer { background: #dbeafe; color: #1e40af; }
    .quick-btn.phone { background: #fef3c7; color: #92400e; }
    .quick-btn.messages { background: #d1fae5; color: #065f46; }
    .quick-btn.back { background: #f3f4f6; color: #374151; }
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e5e7eb;
      display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; background: none; border: none;
      font-size: 0.7rem; color: var(--muted); cursor: pointer; padding: 4px 8px; min-width: 56px;
    }
    .nav-item .icon { font-size: 1.25rem; margin-bottom: 2px; }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    #modal-content {
      background: #fff; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 20px 18px 28px; position: relative;
    }
    .close-modal {
      position: absolute; top: 12px; right: 14px; background: none; border: none;
      font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1;
    }
    .script-box {
      background: #f8fafc; border-left: 3px solid var(--accent); padding: 12px 14px;
      border-radius: 0 10px 10px 0; font-size: 0.95rem; line-height: 1.55;
    }
    .checklist label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 0.95rem; cursor: pointer; }
    .checklist input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }
    .alert { padding: 12px 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.45; }
    .alert-warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .img-guide { width: 100%; border-radius: 12px; display: block; }
    .summary-item {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid #f3f4f6; font-size: 0.95rem;
    }
    .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-box input { flex: 1; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 1rem; }
    .result-item { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .voice-btn {
      width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--primary);
      color: #fff; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 14px rgba(26,60,52,0.35);
    }
    .voice-btn.listening { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .float-mic-panel { display: none !important; }
    .float-mic.listening, .grok-mic.listening { background: var(--danger) !important; animation: pulse 1s infinite; }
    .float-mic.speaking, .grok-mic.speaking { background: #c4a35a !important; animation: none !important; box-shadow: 0 0 0 3px rgba(196,163,90,0.45); }
    .eod-banner {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px; display: none;
    }
    .eod-banner.show { display: block; }
    .grok-dock {
      position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom));
      z-index: 95; background: #fff; border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08); max-width: 100%;
      display: flex; flex-direction: column; max-height: 42vh;
    }
    .grok-dock.hidden { display: none !important; }
    .grok-messages {
      flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 0.92rem; line-height: 1.45;
      min-height: 0; max-height: 28vh;
    }
    .grok-msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 12px; max-width: 95%; }
    .grok-msg.bot { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }
    .grok-msg.user { background: #eff6ff; color: #1e3a8a; margin-left: auto; border: 1px solid #bfdbfe; }
    .grok-msg.warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .coach-box {
      margin: 6px 0 10px; padding: 12px 14px; border-radius: 12px;
      background: #fffbeb; border: 1.5px solid #f59e0b; max-width: 95%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .coach-box-title {
      font-weight: 700; font-size: 0.92rem; color: #92400e; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .coach-box-summary {
      font-size: 0.88rem; color: #78350f; line-height: 1.4; margin-bottom: 8px;
    }
    .coach-box .btn { margin-top: 2px; }
    .grok-input-row {
      display: flex; gap: 8px; padding: 10px 12px 12px; align-items: center;
      border-top: 1px solid #f3f4f6; background: #fafafa;
    }
    .grok-input-row input {
      flex: 1; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 22px;
      font-size: 0.95rem; background: #fff;
    }
    .grok-input-row input:focus { outline: none; border-color: var(--primary); }
    .grok-mic {
      width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary);
      color: #fff; font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .grok-mic.listening { background: var(--danger); animation: pulse 1s infinite; }
    .grok-mic.speaking {
      background: #c4a35a; animation: none;
      box-shadow: 0 0 0 3px rgba(196,163,90,0.45);
    }
    .grok-send {
      padding: 10px 16px; border-radius: 22px; border: none; background: var(--primary);
      color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <img src="images/ui/header.webp" alt="Conroy's Flowers Training" class="header-img" loading="lazy">
    <h1 data-i18n="login_title">Staff Login</h1>
    <p style="font-size:0.8rem;color:var(--muted);margin-bottom:4px">v5.0.4</p>
    <p data-i18n="login_desc">Enter your username and password</p>
    <div class="login-form">
      <input type="text" id="login-username" placeholder="Username" data-i18n-placeholder="username_ph" autocomplete="username" autocapitalize="none">
      <input type="password" id="login-password" placeholder="Password" data-i18n-placeholder="password_ph" autocomplete="current-password">
      <div id="login-error" class="hidden"></div>
      <button class="btn" style="width:100%;margin-top:4px" onclick="doLogin()" data-i18n="login_btn">Login</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <div>
        <div style="font-weight:700;font-size:1.05rem;">Conroy's Training <span style="font-size:0.75rem;opacity:0.8;font-weight:500" onclick="onVersionTap()">v5.0.4</span></div>
        <div class="user-info" id="header-user"></div>
      </div>
      <select class="lang-select" id="lang-select" onchange="changeLang(this.value)" aria-label="Language">
        <option value="en">EN</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="es">ES</option>
      </select>
    </header>

    <div class="main">
      <div id="page-home" class="page active">
        <div class="card">
          <h2>📋 <span data-i18n="today_routine">Today's routine</span></h2>
          <div id="progress-text" style="font-size:0.9rem;color:var(--muted)"></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
        <div id="eod-banner" class="eod-banner">
          <strong id="eod-title">⏰ End of day approaching</strong>
          <span id="eod-desc">Please review today's summary and complete End Day.</span>
          <button class="btn btn-sm" id="eod-btn" style="margin-top:10px;background:#f59e0b;color:#111" onclick="showSummary()">View summary</button>
        </div>
        <div id="next-banner" class="next-banner hidden">
          <span class="next-label" id="next-label">Next</span>
          <span id="next-task-text"></span>
        </div>
        <div class="quick-grid">
          <button class="quick-btn customer" onclick="showPage('customer')">👤 <span data-i18n="customer">Customer</span></button>
          <button class="quick-btn phone" onclick="showPage('phone')">📞 <span data-i18n="phone">Phone</span></button>
          <button class="quick-btn messages" onclick="showPage('messages')">💬 <span data-i18n="messages">Messages</span></button>
          <button class="quick-btn back" onclick="showPage('home')">↩️ <span data-i18n="back_routine">Routine</span></button>
        </div>
        <div class="card" id="stamp-list"></div>
        <div class="card">
          <h2>🏁 <span data-i18n="day_end_summary">End of day</span></h2>
          <button class="btn btn-outline" style="width:100%" onclick="showSummary()" data-i18n="view_summary">View today's summary</button>
        </div>
      </div>

      <div id="page-customer" class="page"></div>
      <div id="page-phone" class="page"></div>
      <div id="page-messages" class="page"></div>

      <div id="page-search" class="page">
        <div class="card">
          <h2 data-i18n="search_title">Ask / Search</h2>
          <div class="search-box">
            <input type="text" id="search-input" placeholder="e.g. SuperTicket, CardIsle..." data-i18n-placeholder="search_ph">
            <button class="btn" onclick="doSearch()" data-i18n="search_btn">Search</button>
          </div>
          <div style="text-align:center;margin:12px 0">
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
          </div>
          <div id="search-results"></div>
          <p style="font-size:0.85rem;color:var(--muted);margin-top:8px" data-i18n="quick_topics">Quick topics</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
            <button class="btn btn-sm btn-outline" onclick="quickSearch('superticket')">SuperTicket</button>
            <button class="btn btn-sm btn-outline" onclick="quickSearch('attachment')">Attachment</button>
            <button class="btn btn-sm btn-outline" onclick="quickSearch('cardisle')">CardIsle</button>
            <button class="btn btn-sm btn-outline" onclick="quickSearch('delivery')">Delivery</button>
            <button class="btn btn-sm btn-outline" onclick="quickSearch('golden')">Golden Rules</button>
          </div>
        </div>
      </div>

      <div id="page-more" class="page">
        <div class="card">
          <h2>📖 <span data-i18n="training_title">Training & guides</span></h2>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('attachments')" data-i18n="att_check">Attachments</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('bmsflow')" data-i18n="bms_flow">BMS workflow</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('delivery')" data-i18n="delivery_guide">Delivery guide</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('golden')" data-i18n="golden_rules">Golden Rules</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('decision')" data-i18n="decision_helper">If unsure</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('customer')">Customer service</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('phone')">Phone</button>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('messages')">Messages / In Wire</button>
        </div>
        <div class="card hidden" id="admin-card">
          <h2>⚙️ Admin</h2>
          <button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openAdminPanel()">Admin Panel</button>
        </div>
        <div class="card">
          <h2 data-i18n="feedback_title">Feedback</h2>
          <textarea id="feedback-text" rows="3" style="width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:0.95rem;margin-bottom:10px" data-i18n-placeholder="feedback_ph"></textarea>
          <button class="btn" style="width:100%" onclick="saveFeedback()" data-i18n="save_feedback">Save</button>
        </div>
        <div class="card">
          <button class="btn btn-outline" style="width:100%;color:var(--danger);border-color:var(--danger)" onclick="doLogout()" data-i18n="logout">Logout</button>
        </div>
      </div>
    </div>

    <nav class="nav-bar">
      <button class="nav-item active" data-page="home" onclick="showPage('home')"><span class="icon">📋</span><span data-i18n="nav_home">Routine</span></button>
      <button class="nav-item" data-page="customer" onclick="showContent('customer')"><span class="icon">👤</span><span data-i18n="nav_customer">Customer</span></button>
      <button class="nav-item" data-page="messages" onclick="showContent('messages')"><span class="icon">💬</span><span data-i18n="nav_msg">Messages</span></button>
      <button class="nav-item" data-page="search" onclick="showPage('search')"><span class="icon">🔍</span><span data-i18n="nav_search">Search</span></button>
      <button class="nav-item" data-page="more" onclick="showPage('more')"><span class="icon">☰</span><span data-i18n="nav_more">More</span></button>
    </nav>
  </div>

  <div id="grok-dock" class="grok-dock hidden">
    <div class="grok-messages" id="grok-messages">
      <div id="float-answer" style="display:none"></div>
      <div id="float-status" style="display:none"></div>
    </div>
    <div class="speak-controls" style="padding:0 12px;gap:6px;display:flex;flex-wrap:wrap">
      <button class="btn btn-sm" id="float-speak-btn" style="display:none" onclick="speakText(window._lastGrokAnswer, this)">🔊 Read</button>
      <button class="btn btn-sm btn-outline" id="float-tasks-btn" style="display:none" onclick="speakRemainingTasks(this)">📋 Tasks</button>
      <button class="btn btn-sm btn-outline" id="float-stop-btn" style="display:none" onclick="stopSpeaking()">⏹ Stop</button>
    </div>
    <div class="grok-input-row">
      <input type="text" id="float-chat-input" placeholder="Ask anything..." autocomplete="off" autocapitalize="sentences">
      <button type="button" class="grok-mic" id="float-mic" onclick="toggleFloatMic()" title="Voice" aria-label="Microphone">🎤</button>
      <button type="button" class="grok-send" onclick="submitFloatChat()">Send</button>
    </div>
  </div>
  <div id="float-mic-panel" class="float-mic-panel" style="display:none" aria-hidden="true"></div>

  <div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()">
    <div id="modal-content"></div>
  </div>

  <script src="js/data.js?v=5.0.4"></script>
  <script src="js/core-a.js?v=5.0.4"></script>
  <script src="js/core-b.js?v=5.0.4"></script>
  <script src="js/core-c.js?v=5.0.4"></script>
  <script src="js/guides-detail.js?v=5.0.4"></script>
  <script src="js/system-prompt.js?v=5.0.4"></script>
  <script src="js/voice-a.js?v=5.0.4"></script>
  <script src="js/voice-b.js?v=5.0.4"></script>
  <script src="js/voice-ui-fix.js?v=5.0.4"></script>
  <script src="js/answer-ui.js?v=5.0.4"></script>
  <script src="js/dock-fix.js?v=5.0.4"></script>
  <script src="js/guide-router.js?v=5.0.4"></script>
  <script src="js/guide-speak.js?v=5.0.4"></script>
  <script src="js/admin.js?v=5.0.4"></script>
  <script>
    (function() {
      var input = document.getElementById('float-chat-input');
      if (input) input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); if (typeof submitFloatChat === 'function') submitFloatChat(); }
      });
    })();
  </script>
</body>
</html>
