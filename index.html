<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a3c34">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Conroy's Training</title>
  <link rel="manifest" href="manifest.json?v=6.1.0">
  <link rel="apple-touch-icon" href="images/ui/header.webp">
  <style>
    :root {
      --primary: #1a3c34; --primary-soft: #e8f0ee; --accent: #c4a35a; --accent-soft: #faf6ee;
      --bg: #f5f3ef; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280;
      --success: #16a34a; --warn: #d97706; --danger: #dc2626; --radius: 16px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04); --header-h: 52px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .hidden { display: none !important; }
    #login-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; }
    .header-img { width: 100%; max-width: 280px; height: auto; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
    #login-screen h1 { font-size: 1.4rem; margin-bottom: 4px; color: var(--primary); }
    .login-form { width: 100%; max-width: 320px; margin-top: 12px; }
    .login-form input { width: 100%; padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 1rem; background: #fff; }
    .login-form input:focus { outline: none; border-color: var(--primary); }
    #login-error { color: var(--danger); font-size: 0.9rem; margin-bottom: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; }
    .btn:active { opacity: 0.85; }
    .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid #d1d5db; }
    .btn-sm { padding: 7px 12px; font-size: 0.82rem; border-radius: 10px; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    .app-header { flex-shrink: 0; height: var(--header-h); background: var(--primary); color: #fff; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header-left { min-width: 0; flex: 1; }
    .header-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-meta { font-size: 0.72rem; opacity: 0.85; margin-top: 1px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .header-progress { display: flex; align-items: center; gap: 6px; min-width: 90px; }
    .header-progress-bar { width: 56px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
    .header-progress-bar > div { height: 100%; background: #86efac; border-radius: 2px; transition: width 0.3s; }
    .user-info { font-size: 0.7rem; opacity: 0.8; }
    .lang-select { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 5px 6px; font-size: 0.78rem; flex-shrink: 0; }
    .lang-select option { color: #111; }
    .main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0; }
    .page { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    .page.active { display: flex; }
    #page-home { background: var(--bg); }
    .home-top { flex-shrink: 0; padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
    .quick-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; border: none; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; background: var(--card); color: var(--primary); box-shadow: var(--shadow); white-space: nowrap; }
    .chip.customer { background: #eff6ff; color: #1e40af; }
    .chip.phone { background: #fffbeb; color: #92400e; }
    .chip.messages { background: #ecfdf5; color: #065f46; }
    .chip.delivery { background: #fdf2f8; color: #9d174d; }
    .routine-panel { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
    .routine-next { padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f3f4f6; }
    .routine-next-label { font-size: 0.72rem; font-weight: 700; color: #065f46; background: #d1fae5; padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
    .routine-next-text { font-size: 0.88rem; font-weight: 600; color: var(--text); min-width: 0; }
    .routine-accordion-btn { width: 100%; border: none; background: transparent; cursor: pointer; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .routine-accordion-btn.open .chevron { transform: rotate(180deg); }
    .chevron { transition: transform 0.2s; }
    #stamp-list { display: none; max-height: 36vh; overflow-y: auto; border-top: 1px solid #f3f4f6; padding: 4px 8px 8px; }
    #stamp-list.open { display: block; }
    .stamp-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 6px; border-bottom: 1px solid #f5f5f5; }
    .stamp-item:last-child { border-bottom: none; }
    .stamp-item.next-task { background: #f0fdf4; border-radius: 10px; padding: 10px 8px; }
    .stamp-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.8rem; cursor: pointer; background: #fff; }
    .stamp-btn.done { background: var(--success); border-color: var(--success); color: #fff; }
    .stamp-content { flex: 1; min-width: 0; }
    .stamp-title { font-weight: 600; font-size: 0.9rem; }
    .stamp-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .stamp-time { font-size: 0.75rem; color: var(--success); margin-top: 3px; }
    #grok-dock { flex: 1; min-height: 0; position: relative; left: auto; right: auto; bottom: auto; display: flex; flex-direction: column; max-height: none; z-index: 1; margin: 0 10px 0; border-radius: 16px 16px 0 0; overflow: hidden; background: var(--card); box-shadow: var(--shadow); border: none; }
    #grok-dock.hidden { display: none !important; }
    .grok-messages { flex: 1; overflow-y: auto; padding: 14px 14px 10px; font-size: 0.92rem; line-height: 1.5; min-height: 0; -webkit-overflow-scrolling: touch; }
    .grok-msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 14px; max-width: 92%; word-break: break-word; }
    .grok-msg.bot { background: var(--primary-soft); color: #14532d; border: 1px solid #cce3db; border-bottom-left-radius: 4px; }
    .grok-msg.user { background: #eff6ff; color: #1e3a8a; margin-left: auto; border: 1px solid #bfdbfe; border-bottom-right-radius: 4px; }
    .coach-box { margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); border: 1.5px solid #e8d4a8; max-width: 95%; }
    .coach-box-title { font-weight: 700; font-size: 0.9rem; color: #92400e; margin-bottom: 4px; }
    .coach-box-summary { font-size: 0.84rem; color: #78350f; line-height: 1.4; margin-bottom: 8px; }
    .speak-controls { flex-shrink: 0; padding: 0 12px 6px; gap: 6px; display: flex; flex-wrap: wrap; }
    .grok-input-row { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; align-items: center; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .grok-input-row input { flex: 1; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 24px; font-size: 0.95rem; background: #fff; }
    .grok-input-row input:focus { outline: none; border-color: var(--primary); }
    .grok-mic { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 1.15rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .grok-mic.listening { background: var(--danger); animation: pulse 1s infinite; }
    .grok-mic.speaking { background: var(--accent); box-shadow: 0 0 0 3px rgba(196,163,90,0.4); }
    .grok-send { padding: 11px 16px; border-radius: 22px; border: none; background: var(--primary); color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .page-scroll { flex: 1; overflow-y: auto; padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); }
    .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-box input { flex: 1; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 1rem; }
    .result-item { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .voice-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--primary); color: #fff; font-size: 1.4rem; cursor: pointer; }
    .alert { padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .eod-banner { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: none; }
    .eod-banner.show { display: block; }
    .next-banner { display: none !important; }
    .float-mic-panel { display: none !important; }
    .nav-bar { flex-shrink: 0; background: #fff; border-top: 1px solid #e8e8e8; display: flex; justify-content: space-around; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; font-size: 0.65rem; color: var(--muted); cursor: pointer; padding: 4px 6px; min-width: 52px; gap: 2px; }
    .nav-item .icon { font-size: 1.2rem; line-height: 1; }
    .nav-item.active { color: var(--primary); font-weight: 700; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    #modal-content { background: #fff; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 18px 28px; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1; }
    #progress-text { font-size: 0.72rem; }
    .checklist { margin: 4px 0 12px; }
    .checklist label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; line-height: 1.45; font-size: 0.92rem; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
    .checklist label:last-child { border-bottom: none; }
    .checklist input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="login-screen">
    <img src="images/ui/header.webp" alt="Conroy's Flowers Training" class="header-img" loading="lazy">
    <h1 data-i18n="login_title">Staff Login</h1>
    <p style="font-size:0.78rem;color:var(--muted);margin-bottom:4px">v6.1.0</p>
    <p data-i18n="login_desc">Enter your username and password</p>
    <div class="login-form">
      <input type="text" id="login-username" placeholder="Username" data-i18n-placeholder="username_ph" autocomplete="username" autocapitalize="none">
      <input type="password" id="login-password" placeholder="Password" data-i18n-placeholder="password_ph" autocomplete="current-password">
      <div id="login-error" class="hidden"></div>
      <button class="btn" style="width:100%;margin-top:4px" onclick="doLogin()" data-i18n="login_btn">Login</button>
    </div>
  </div>
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-left">
        <div class="header-title">Conroy's Training <span style="opacity:0.7;font-weight:500;font-size:0.75rem" onclick="onVersionTap()">v6.1.0</span></div>
        <div class="header-meta">
          <span id="header-date"></span>
          <span class="header-progress"><span id="progress-text">0 / 0</span><span class="header-progress-bar"><div id="progress-fill" style="width:0%"></div></span></span>
          <span class="user-info" id="header-user"></span>
        </div>
      </div>
      <select class="lang-select" id="lang-select" onchange="changeLang(this.value)" aria-label="Language">
        <option value="en">EN</option><option value="ko">한국어</option><option value="ja">日本語</option><option value="es">ES</option>
      </select>
    </header>
    <div class="main">
      <div id="page-home" class="page active">
        <div class="home-top">
          <div id="eod-banner" class="eod-banner"><strong id="eod-title">End of day approaching</strong> <span id="eod-desc">Please review today's summary.</span><button class="btn btn-sm" id="eod-btn" style="margin-top:8px;background:#f59e0b;color:#111" onclick="showSummary()">View summary</button></div>
          <div class="quick-chips">
            <button type="button" class="chip customer" onclick="quickGuideAsk('customer')">Customer</button>
            <button type="button" class="chip phone" onclick="quickGuideAsk('phone')">Phone</button>
            <button type="button" class="chip messages" onclick="quickGuideAsk('messages')">Messages</button>
            <button type="button" class="chip delivery" onclick="quickGuideAsk('delivery')">Delivery</button>
          </div>
          <div class="routine-panel">
            <div class="routine-next" id="routine-next-row"><span class="routine-next-label" id="next-label">Next</span><span class="routine-next-text" id="next-task-text">—</span></div>
            <div id="next-banner" class="next-banner hidden"></div>
            <button type="button" class="routine-accordion-btn" id="routine-accordion-btn" onclick="toggleRoutineList()"><span id="routine-accordion-label">View routine checklist</span><span class="chevron">▾</span></button>
            <div id="stamp-list"></div>
          </div>
        </div>
        <div id="grok-dock" class="grok-dock">
          <div class="grok-messages" id="grok-messages"><div id="float-answer" style="display:none"></div><div id="float-status" style="display:none"></div></div>
          <div class="speak-controls" style="display:flex;flex-wrap:wrap">
            <button class="btn btn-sm" id="float-speak-btn" style="display:none" onclick="speakText(window._lastGrokAnswer, this)">Read</button>
            <button class="btn btn-sm btn-outline" id="float-tasks-btn" style="display:none" onclick="speakRemainingTasks(this)">Tasks</button>
            <button class="btn btn-sm btn-outline" id="float-stop-btn" style="display:none" onclick="stopSpeaking()">Stop</button>
          </div>
          <div class="grok-input-row">
            <input type="text" id="float-chat-input" placeholder="Ask anything..." autocomplete="off" autocapitalize="sentences">
            <button type="button" class="grok-mic" id="float-mic" onclick="toggleFloatMic()" title="Voice" aria-label="Microphone">🎤</button>
            <button type="button" class="grok-send" onclick="submitFloatChat()">Send</button>
          </div>
        </div>
      </div>
      <div id="page-customer" class="page"><div class="page-scroll" id="page-customer-inner"></div></div>
      <div id="page-phone" class="page"><div class="page-scroll" id="page-phone-inner"></div></div>
      <div id="page-messages" class="page"><div class="page-scroll" id="page-messages-inner"></div></div>
      <div id="page-search" class="page"><div class="page-scroll"><div class="card"><h2 data-i18n="search_title">Ask / Search</h2><div class="search-box"><input type="text" id="search-input" placeholder="e.g. SuperTicket..."><button class="btn" onclick="doSearch()">Search</button></div><div style="text-align:center;margin:12px 0"><button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button></div><div id="search-results"></div></div></div></div>
      <div id="page-more" class="page"><div class="page-scroll"><div class="card"><h2 data-i18n="training_title">Training & guides</h2><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('attachments')">Attachments</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('bmsflow')">BMS workflow</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('delivery')">Delivery guide</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('golden')">Golden Rules</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="showContent('customer')">Customer service</button></div><div class="card"><h2 data-i18n="day_end_summary">End of day</h2><button class="btn btn-outline" style="width:100%" onclick="showSummary()">View today's summary</button></div><div class="card hidden" id="admin-card"><h2>Admin</h2><button class="btn btn-outline" style="width:100%" onclick="openAdminPanel()">Admin Panel</button></div><div class="card"><button class="btn btn-outline" style="width:100%;color:var(--danger);border-color:var(--danger)" onclick="doLogout()" data-i18n="logout">Logout</button></div></div></div>
    </div>
    <nav class="nav-bar">
      <button class="nav-item active" data-page="home" onclick="showPage('home')"><span class="icon">💬</span><span data-i18n="nav_home">Chat</span></button>
      <button class="nav-item" data-page="customer" onclick="showContent('customer')"><span class="icon">👤</span><span data-i18n="nav_customer">Customer</span></button>
      <button class="nav-item" data-page="messages" onclick="showContent('messages')"><span class="icon">📋</span><span data-i18n="nav_msg">Messages</span></button>
      <button class="nav-item" data-page="search" onclick="showPage('search')"><span class="icon">🔍</span><span data-i18n="nav_search">Search</span></button>
      <button class="nav-item" data-page="more" onclick="showPage('more')"><span class="icon">☰</span><span data-i18n="nav_more">More</span></button>
    </nav>
  </div>
  <div id="float-mic-panel" class="float-mic-panel" style="display:none" aria-hidden="true"></div>
  <div id="modal-overlay" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()"><div id="modal-content"></div></div>
  <script src="js/data.js?v=6.1.0"></script>
  <script src="js/core-a.js?v=6.1.0"></script>
  <script src="js/core-b.js?v=6.1.0"></script>
  <script src="js/core-c.js?v=6.1.0"></script>
  <script src="js/guides-detail.js?v=6.1.0"></script>
  <script src="js/system-prompt.js?v=6.1.0"></script>
  <script src="js/voice-a.js?v=6.1.0"></script>
  <script src="js/voice-b.js?v=6.1.0"></script>
  <script src="js/voice-ui-fix.js?v=6.1.0"></script>
  <script src="js/answer-ui.js?v=6.1.0"></script>
  <script src="js/runtime-v6.js?v=6.1.0"></script>
  <script src="js/guide-router.js?v=6.1.0"></script>
  <script src="js/admin.js?v=6.1.0"></script>
  <script src="js/ui-layout.js?v=6.1.0"></script>
  <script>
    (function() {
      var input = document.getElementById('float-chat-input');
      if (input) input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); if (typeof submitFloatChat === 'function') submitFloatChat(); }
      });
      try {
        var el = document.getElementById('header-date');
        if (el) el.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      } catch (e) {}
    })();
  </script>
</body>
</html>
